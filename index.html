<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07152c">
  <title>Academic Aid Costa Rica</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at 20% 20%, #1674a8 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #08146b 0%, transparent 40%),
        #07152c;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 620px;
      padding: 48px;
      border: 1px solid rgba(0, 238, 255, .35);
      border-radius: 24px;
      background: rgba(7, 21, 44, .82);
      box-shadow:
        0 0 60px rgba(0, 238, 255, .12),
        0 30px 80px rgba(0, 0, 0, .45);
      backdrop-filter: blur(12px);
    }

    .brand {
      color: #00eaff;
      font-weight: 800;
      letter-spacing: 3px;
      font-size: 14px;
      margin-bottom: 28px;
    }

    h1 {
      font-size: clamp(42px, 8vw, 68px);
      line-height: .95;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    h1 span {
      color: #00f0f5;
    }

    .description {
      font-size: 19px;
      line-height: 1.5;
      color: #dce9f5;
      margin-bottom: 22px;
    }

    .services {
      color: #a9c6dc;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .no-cisco {
      display: inline-block;
      padding: 8px 13px;
      border: 1px solid #00eaff;
      border-radius: 999px;
      color: #00eaff;
      font-weight: bold;
      margin-bottom: 32px;
    }

    .whatsapp {
      display: block;
      width: 100%;
      text-align: center;
      padding: 17px 24px;
      background: #25d366;
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: 800;
      border-radius: 12px;
      transition: .15s ease;
    }

    .whatsapp:hover {
      transform: translateY(-2px);
      filter: brightness(1.07);
    }

    .number {
      text-align: center;
      margin-top: 14px;
      font-size: 14px;
      color: #829bb0;
    }

    @media (max-width: 600px) {
      .card {
        padding: 34px 24px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="brand">ACADEMIC AID · COSTA RICA</div>

    <h1>
      ¿NO TE<br>
      <span>CORRE EL CÓDIGO?</span>
    </h1>

    <p class="description">
      Tutorías y apoyo académico en informática.
    </p>

    <p class="services">
      Programación · Bases de datos · Sistemas · Desarrollo · Proyectos
    </p>

    <div class="no-cisco">
      Todo menos Cisco / Redes
    </div>

    <a
      class="whatsapp"
      href="https://wa.me/50688728562"
    >
      Hablar por WhatsApp
    </a>

    <div class="number">
      +506 8872-8562 · Raúl Montero
    </div>
  </main>
</body>
</html>
